name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          rm godot.zip

      - uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      # The first import on a fresh checkout only builds the class cache.
      - name: Import assets
        run: |
          timeout 1500 "$RUNNER_TEMP/godot" --headless --path . --import
          timeout 1500 "$RUNNER_TEMP/godot" --headless --path . --import

      - name: Run tests
        run: tests/run_all.sh "$RUNNER_TEMP/godot"
